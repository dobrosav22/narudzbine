        "summary": "request Password Reset",
        "description": "Public generic 202 acknowledgement for unknown, deactivated and address-throttled addresses. At most three issued links/address/hour and twenty requests/source/hour; source abuse returns 429/Retry-After. A newly issued link invalidates older unused proofs; suppressed requests leave the current link unchanged. Only a hashed 30-minute single-use proof and encrypted transactional delivery intent are stored; actual mail delivery is a separate gated integration.",
