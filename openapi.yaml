      "CaseDispositionItem": {
        "type": "object",
        "additionalProperties": false,
        "description": "One of ten mandatory distinct families. APPLIED links a completed applied job for the same case/subject and matching policy (REQUESTER_NAMES_V1 also covers current display name). RETAINED is an accountable operator decision with a reference, not measured erasure. ADDITIONAL_SCOPE is PENDING or REVIEWED_NO_ADDITIONAL_SCOPE; the latter is an operator review finding, not machine-proven absence. Other families cannot use that finding. Non-APPLIED items require explicit null jobId.",
        "properties": {
          "family": {
            "type": "string",
            "enum": [
              "CURRENT_DISPLAY_NAME",
              "HISTORICAL_ATTRIBUTION",
              "LOGIN_EMAIL",
              "SHARED_MESSAGE_TEXT",
              "CONTACTS_LOCATIONS",
              "COMMERCIAL_DOCUMENTS_MEDIA",
              "AUDIT_IDENTITY_HISTORY",
              "PROVIDER_DELIVERY_COPIES",
              "BACKUPS_ARCHIVES",
              "ADDITIONAL_SCOPE"
            ]
          },
          "disposition": {
            "type": "string",
            "enum": [
              "APPLIED",
              "RETAINED",
              "PENDING",
              "REVIEWED_NO_ADDITIONAL_SCOPE"
            ]
          },
          "jobId": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Id"
              },
              {
                "type": "null"
              }
            ]
          },
          "reference": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,99}$",
            "maxLength": 100
          }
        },
        "required": [
          "family",
          "disposition",
          "jobId",
          "reference"
        ]
      },
