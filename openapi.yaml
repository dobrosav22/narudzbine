    "/auth/reauthentication": {
      "post": {
        "operationId": "reauthenticate",
        "tags": [
          "identity"
        ],
        "summary": "reauthenticate",
        "description": "Password-only reauthentication of the current application session. Derive account/email/provider binding from the session; reject client-selected identity fields. Browser requires current cookie, allowed Origin and current X-CSRF-Token. Native uses bearer with no Origin or authentication cookies. Verify provider credentials outside database transactions, then recheck current state before rotating session/CSRF secrets. Preserve session ID, creation, device label, idle activity and absolute expiry. Update password proof/authAt; do not revoke other sessions. No MFA. Default HTTP/provider activation remains off until configured acceptance.",
        "x-authorization": "current account plus fresh credential proof",
        "x-transaction": "short authenticated snapshot; durable API/credential throttle admission; provider call outside transaction; short current-state rotation transaction",
        "x-retry-policy": "no separate key and no old-secret grace; concurrent original-token requests have at most one success; lost successful response requires ordinary login",
        "x-slice": "identity",
        "parameters": [
          {
            "$ref": "#/components/parameters/Csrf"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful result; current authorization required even on replay.",
