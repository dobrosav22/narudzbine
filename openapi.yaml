    "/auth/password-changes": {
      "post": {
        "operationId": "changePassword",
        "tags": [
          "identity"
        ],
        "summary": "change Password",
        "description": "Recently authenticated own account only; browser Origin/CSRF or native bearer. Success retains current session ID and absolute deadline, rotates its secret/CSRF immediately and revokes other sessions. Completed credential update and mandatory PASSWORD_CHANGED notice/email intent commit together. A session expiring/logging out during the remote call requires fresh login even if the password was changed. Shape errors return 422 VALIDATION_FAILED; managed common/compromised policy rejection returns 422 PASSWORD_REJECTED without restoring retired sessions. Unknown provider outcome leaves a durable security barrier.",
        "x-authorization": "current account, authentication <5 minutes",
        "x-transaction": "commit authorization, pending operation, epoch and session invalidation; one provider write outside transactions; durable applied outcome then atomic session/account/audit/notice/outbox completion",
        "x-retry-policy": "No success-secret replay, grace period or separate key. Retired credential cannot repeat the change. After response loss/503 use ordinary login, which may finish positively confirmed local work before verifying the password; it never repeats the provider write.",
        "x-slice": "identity",
        "parameters": [
          {
            "$ref": "#/components/parameters/Csrf"
          }
        ],
        "responses": {
          "200": {
            "description": "Password changed; current session identity/absolute deadline retained with immediately rotated secret/CSRF. Native bearerToken or browser Set-Cookie; no credential replay cache.",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "$ref": "#/components/schemas/Id"
                }
              }
