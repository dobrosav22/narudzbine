    "/auth/password-resets": {
      "post": {
        "operationId": "completePasswordReset",
        "tags": [
          "identity"
        ],
        "summary": "complete Password Reset",
        "description": "Consumes the latest unexpired account/email/security-version-bound proof once. Invalid/used/superseded/expired/revoked proofs return 409 TOKEN_INVALID; pending uncertain credential work returns 409 REQUEST_IN_PROGRESS. Passwords preserve 15-128 Unicode code points/spaces without normalization; configured managed policy rejects common/compromised passwords (422 PASSWORD_REJECTED). Success revokes all sessions and queues mandatory PASSWORD_CHANGED notices; fresh login required. Proof is consumed when provider-write preparation commits, including later definite provider rejection. No password is persisted.",
        "x-authorization": "latest valid reset token",
        "x-transaction": "commit proof consumption, operation barrier, epoch and revocations; one provider write outside transactions; durable applied outcome then atomic local completion/audit/notice/outbox",
        "x-retry-policy": "Single-use proof; no success replay or separate key. On response loss/503 use ordinary login to reconcile positively confirmed application before password verification. Never replay an unknown provider write or bypass its barrier with another reset.",
        "x-slice": "identity",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Password reset completed; accepted=true. All application sessions are revoked; no session credential returned. Consumed proofs cannot replay success.",
            "headers": {
              "X-Request-Id": {
                "schema": {
                  "$ref": "#/components/schemas/Id"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
