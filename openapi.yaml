      "BulkPrice": {
        "type": "object",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "SET",
              "PERCENT_CHANGE"
            ]
          },
          "value": {
            "type": "string",
            "pattern": "^-?(0|[1-9][0-9]{0,8})(\\.[0-9]{1,2})?$"
          }
        },
        "required": [
          "kind",
          "value"
        ],
        "additionalProperties": false,
        "description": "SET is a positive base amount through999999999.99. PERCENT_CHANGE must be greater than-100 and at most1000, with up to two decimals; requires existing base. Round adjusted base half-up to two decimals; zero/negative/overflow result invalid. Existing tiers unchanged unless corrected."
      },
      "BulkChange": {
        "type": "object",
        "properties": {
          "targets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BulkTarget"
            },
            "minItems": 1,
            "maxItems": 100
          },
          "price": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/BulkPrice"
              },
              {
                "type": "null"
              }
            ]
          },
          "categoryId": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Id"
              },
              {
                "type": "null"
              }
            ]
          },
          "addTagIds": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Id"
            },
            "maxItems": 50,
            "uniqueItems": true
          },
          "removeTagIds": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Id"
            },
            "maxItems": 50,
            "uniqueItems": true
          },
          "active": {
            "anyOf": [
              {
                "type": "boolean"
              },
              {
                "type": "null"
              }
            ]
          },
          "tierCorrections": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "productId": {
                  "$ref": "#/components/schemas/Id"
                },
                "tiers": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Tier"
                  },
                  "maxItems": 50
                }
              },
              "required": [
                "productId",
                "tiers"
              ],
              "additionalProperties": false
            },
            "maxItems": 100
          }
        },
        "required": [
          "targets"
        ],
        "additionalProperties": false,
        "description": "Missing actions leave fields unchanged. Explicit categoryId:null clears category; null price/active leave unchanged. Omitted arrays are empty; reject no-action commands. Targets unique by productId; each correction targets a unique listed product. Tag additions/removals unique, disjoint, current same-vendor TAG records; resulting sets max50. Price/tier changes validate the complete resulting schedule; explicit deactivation precedes edits, activation follows edits and normal unit/price/stock eligibility. No partial success."
      },
