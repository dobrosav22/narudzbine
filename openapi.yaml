      "CaseDisposition": {
        "type": "object",
        "additionalProperties": false,
        "description": "Immutable original assisted review result. COMPLETED resolves the reviewed case with explicit retained scope; allDataErased is always false. It does not assert legal compliance, provider erasure or absence of every copy.",
